<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito IoT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: white; }
    button { margin: 10px; padding: 15px 30px; font-size: 18px; border: none; border-radius: 12px; background: #ff4444; color: white; cursor: pointer; }
    button:hover { background: #ff6666; }
  </style>
</head>
<body>
  <h1>🚗 Control Remoto IoT</h1>
  <p>Haz clic para enviar comandos al carrito</p>

  <div id="botones"></div>

  <script>
    const broker = "wss://b3b91384be8341c88c83bd5a612a39f0.s1.eu.hivemq.cloud:8884/mqtt"; // tu cluster
    const options = {
      username: "carrito",
      password: "Carrito101011",
      reconnectPeriod: 1000,
      connectTimeout: 4000,
    };

    const topic = "carrito/accion";
    const client = mqtt.connect(broker, options);

    client.on("connect", () => {
      console.log("Conectado a MQTT");
    });

    const botones = ["Botón 0", "Botón 1", "Botón 2", "Botón 3", "Botón 4"];
    const div = document.getElementById("botones");

    botones.forEach((texto, i) => {
      const btn = document.createElement("button");
      btn.textContent = texto;
      btn.onclick = () => client.publish(topic, i.toString());
      div.appendChild(btn);
    });
  </script>
</body>
</html>
