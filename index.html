<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito IoT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: white; }
    button { margin: 10px; padding: 15px 30px; font-size: 18px; border: none; border-radius: 12px; background: #ff4444; color: white; cursor: pointer; }
    button:hover { background: #ff6666; }
  </style>
</head>
<body>
  <h1>🚗 Control Remoto IoT</h1>
  <p>Haz clic para enviar comandos al carrito</p>

  <div id="botones"></div>

  <script>
    const broker = "wss://b3b91384be8341c88c83bd5a612a39f0.s1.eu.hivemq.cloud:8884/mqtt"; // tu cluster
    const options = {
      username: "carrito",
      password: "Carrito101011",
      reconnectPeriod: 1000,
      connectTimeout: 4000,
    };

    const topic = "carrito/accion";
    const client = mqtt.connect(broker, options);
  
    client.on("connect", () => console.log("✅ Conectado a MQTT"));
  
    const botones = ["Adelante", "Atrás", "Izquierda", "Derecha", "Turbo"];
    const div = document.getElementById("botones");
  
    botones.forEach((texto, i) => {
      const btn = document.createElement("button");
      btn.textContent = texto;
      
      // Mantener HIGH mientras esté presionado
      btn.onmousedown = () => client.publish(topic, `press_${i}`);
      btn.ontouchstart = (e) => { e.preventDefault(); client.publish(topic, `press_${i}`); };
  
      // Mandar LOW al soltar
      btn.onmouseup = () => client.publish(topic, `release_${i}`);
      btn.onmouseleave = () => client.publish(topic, `release_${i}`);
      btn.ontouchend = (e) => { e.preventDefault(); client.publish(topic, `release_${i}`); };
  
      div.appendChild(btn);
  </script>
</body>
</html>
