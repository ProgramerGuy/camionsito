<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Control ESP32</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { 
      getDatabase, ref, set, onValue 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // 🔧 CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyB6VwZBsRRQ3G2QucN5p4I70GzHfHTvPtA",
      authDomain: "esp32c3-rc-control-test.firebaseapp.com",
      databaseURL: "https://esp32c3-rc-control-test-default-rtdb.firebaseio.com",
      projectId: "esp32c3-rc-control-test",
      storageBucket: "esp32c3-rc-control-test.firebasestorage.app",
      messagingSenderId: "490283159347",
      appId: "1:490283159347:web:c98d05ba656d7f1fc6f846"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginDiv = document.getElementById("login");
    const controlDiv = document.getElementById("control");
    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const userSpan = document.getElementById("userEmail");

    // 🧠 Detectar sesión activa
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginDiv.style.display = "none";
        controlDiv.style.display = "block";
        userSpan.innerText = user.email;
        initButtons();
      } else {
        controlDiv.style.display = "none";
        loginDiv.style.display = "block";
      }
    });

    // 🔐 Iniciar sesión
    window.login = () => {
      const email = emailInput.value;
      const password = passInput.value;
      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => alert("Error: " + error.message));
    }

    // 🚪 Cerrar sesión
    window.logout = () => {
      signOut(auth);
    }

    // 🔘 Inicializar botones en tiempo real
    function initButtons() {
      for (let i = 1; i <= 5; i++) {
        const btnRef = ref(db, 'control/btn' + i);
        onValue(btnRef, (snapshot) => {
          const state = snapshot.val();
          const btn = document.getElementById("btn" + i);
          btn.innerText = "Botón " + i + " (" + (state ? "ON" : "OFF") + ")";
          btn.style.backgroundColor = state ? "#4CAF50" : "#f44336";
        });
      }
    }

    // 🟢 Cambiar valor
    window.toggleBtn = (i) => {
      const btnRef = ref(db, 'control/btn' + i);
      onValue(btnRef, (snapshot) => {
        const val = snapshot.val();
        set(btnRef, !val);
      }, { onlyOnce: true });
    }

  </script>

  <style>
    body {
      background-color: #222;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    button {
      padding: 20px;
      margin: 10px;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border: none;
    }
    #control {
      display: none;
    }
    input {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      font-size: 16px;
      border: none;
    }
  </style>
</head>

<body>
  <div id="login">
    <h2>Iniciar Sesión</h2>
    <input type="email" id="email" placeholder="Correo"><br>
    <input type="password" id="password" placeholder="Contraseña"><br>
    <button onclick="login()">Entrar</button>
  </div>

  <div id="control">
    <h2>Panel de Control</h2>
    <p>Usuario: <span id="userEmail"></span></p>
    <button onclick="logout()">Cerrar sesión</button><br>
    <div>
      <button id="btn1" onclick="toggleBtn(1)">Botón 1</button>
      <button id="btn2" onclick="toggleBtn(2)">Botón 2</button>
      <button id="btn3" onclick="toggleBtn(3)">Botón 3</button>
      <button id="btn4" onclick="toggleBtn(4)">Botón 4</button>
      <button id="btn5" onclick="toggleBtn(5)">Botón 5</button>
    </div>
  </div>
</body>
</html>
