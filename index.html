<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🚜 Control IoT – Carrito Excavador</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0b0c10;
      color: #fff;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { margin-bottom: 10px; }
    #pad {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 10px;
      margin: 30px;
    }
    button {
      border: none;
      border-radius: 12px;
      background: #ff4444;
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    button:hover { background: #ff6666; }
    button:active { background: #ff2222; }
    #extra {
      margin-top: 15px;
      padding: 15px 40px;
      font-size: 20px;
      background: #ffaa00;
      border-radius: 15px;
    }
    #status {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>🚜 Control IoT del Carrito</h1>
  <p>Usa los botones o las teclas <b>W, A, S, D</b> y <b>Espacio</b></p>

  <div id="pad">
    <div></div>
    <button id="up">↑</button>
    <div></div>

    <button id="left">←</button>
    <div></div>
    <button id="right">→</button>

    <div></div>
    <button id="down">↓</button>
    <div></div>
  </div>

  <button id="extra">⛏️ Escarbar</button>
  <p id="status">Conectando...</p>

  <script>
    // -----------------------------
    // CONFIGURACIÓN MQTT
    // -----------------------------
    const broker = "wss://b3b91384be8341c88c83bd5a612a39f0.s1.eu.hivemq.cloud:8884/mqtt"; // tu cluster
    const options = {
      username: "carrito",
      password: "Carrito101011",
      reconnectPeriod: 1000,
      connectTimeout: 4000,
    };
    const topic = "carrito/accion";
    const client = mqtt.connect(broker, options);

    const statusEl = document.getElementById("status");

    client.on("connect", () => {
      statusEl.textContent = "✅ Conectado a MQTT";
    });
    client.on("error", (err) => {
      statusEl.textContent = "❌ Error de conexión: " + err.message;
    });

    // -----------------------------
    // MAPA DE BOTONES
    // -----------------------------
    const controles = {
      up: 0,
      down: 1,
      left: 3,
      right: 4,
      extra: 2, // Escarbar
    };

    function sendPress(id) {
      const idx = controles[id];
      if (idx !== undefined) {
        client.publish(topic, `press_${idx}`);
      }
    }
    function sendRelease(id) {
      const idx = controles[id];
      if (idx !== undefined) {
        client.publish(topic, `release_${idx}`);
      }
    }

    // -----------------------------
    // EVENTOS DE BOTONES TÁCTILES
    // -----------------------------
    Object.keys(controles).forEach(id => {
      const btn = document.getElementById(id);
      if (!btn) return;

      btn.onmousedown = () => sendPress(id);
      btn.onmouseup = () => sendRelease(id);
      btn.onmouseleave = () => sendRelease(id);

      btn.ontouchstart = e => { e.preventDefault(); sendPress(id); };
      btn.ontouchend = e => { e.preventDefault(); sendRelease(id); };
    });

    // -----------------------------
    // EVENTOS DE TECLADO
    // -----------------------------
    const keyMap = {
      'w': 'up',
      'a': 'left',
      's': 'down',
      'd': 'right',
      ' ': 'extra',
    };
    const activeKeys = {};

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key] && !activeKeys[key]) {
        activeKeys[key] = true;
        sendPress(keyMap[key]);
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key]) {
        activeKeys[key] = false;
        sendRelease(keyMap[key]);
      }
    });
  </script>
</body>
</html>
