<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🚜 Control IoT – Carrito Excavador</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0b0c10;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 { margin-top: 10px; }
    #pad {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }
    button {
      border: none;
      border-radius: 12px;
      background: #ff4444;
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    button:hover { background: #ff6666; }
    button:active { background: #ff2222; }
    #extra {
      margin-top: 15px;
      padding: 15px 40px;
      font-size: 20px;
      background: #ffaa00;
      border-radius: 15px;
    }
    #status {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 15px;
    }
    iframe {
      width: 90%;
      max-width: 640px;
      height: 360px;
      border: 3px solid #333;
      border-radius: 10px;
      margin: 20px 0;
    }
    @media (max-width: 600px) {
      #pad {
        grid-template-columns: 60px 60px 60px;
        grid-template-rows: 60px 60px 60px;
      }
      button {
        font-size: 16px;
      }
      #extra {
        padding: 10px 25px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <h1>🚜 Control IoT del Carrito</h1>
  <div id="videoContainer"></div>
  <p id="status">Conectando...</p>
  <div id="controls" style="display:none;">
    <p>Usa los botones o las teclas <b>W, A, S, D</b> y <b>Espacio</b></p>
    <div id="pad">
      <div></div><button id="up">↑</button><div></div>
      <button id="left">←</button><div></div><button id="right">→</button>
      <div></div><button id="down">↓</button><div></div>
    </div>
    <button id="extra">⛏️ Escarbar</button>
  </div>

  <script>
    // ========================
    // 🔐 TOKEN DE ACCESO
    // ========================
    const TOKEN_VALIDO = "rojo23"; // mismo token que usa Flask
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    if (token !== TOKEN_VALIDO) {
      document.body.innerHTML = `
        <h1>🚫 Acceso denegado</h1>
        <p>Token inválido o faltante. No puedes controlar ni ver la cámara.</p>
      `;
      throw new Error("Token inválido");
    }

    // ========================
    // 📷 VIDEO STREAM
    // ========================
    const videoContainer = document.getElementById("videoContainer");

    // Reemplaza el enlace con el de tu túnel Cloudflare real:
    const CAMERA_URL = "https://preview-residents-spring-designs.trycloudflare.com/cam";

    // const iframe = document.createElement("iframe");
    // iframe.src = CAMERA_URL;
    // iframe.allow = "autoplay";
    // videoContainer.appendChild(iframe);

    // ========================
    // 🚗 CONTROL DEL CARRITO (MQTT)
    // ========================
    const broker = "wss://b3b91384be8341c88c83bd5a612a39f0.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
      username: "carrito",
      password: "Carrito101011",
      reconnectPeriod: 1000,
      connectTimeout: 4000,
    };
    const topic = "carrito/accion";
    const client = mqtt.connect(broker, options);

    const statusEl = document.getElementById("status");
    const controls = document.getElementById("controls");

    client.on("connect", () => {
      statusEl.textContent = "✅ Conectado a MQTT";
      controls.style.display = "block";
    });
    client.on("error", (err) => {
      statusEl.textContent = "❌ Error de conexión: " + err.message;
    });

    const controles = {
      up: 0,
      down: 1,
      extra: 2,  // Escarbar
      left: 3,
      right: 4
    };

    function sendPress(id) {
      const idx = controles[id];
      if (idx !== undefined) {
        client.publish(topic, `press_${idx}`);
      }
    }
    function sendRelease(id) {
      const idx = controles[id];
      if (idx !== undefined) {
        client.publish(topic, `release_${idx}`);
      }
    }

    Object.keys(controles).forEach(id => {
      const btn = document.getElementById(id);
      if (!btn) return;

      btn.onmousedown = () => sendPress(id);
      btn.onmouseup = () => sendRelease(id);
      btn.onmouseleave = () => sendRelease(id);

      btn.ontouchstart = e => { e.preventDefault(); sendPress(id); };
      btn.ontouchend = e => { e.preventDefault(); sendRelease(id); };
    });

    const keyMap = {
      'w': 'up',
      'a': 'left',
      's': 'down',
      'd': 'right',
      ' ': 'extra',
    };
    const activeKeys = {};

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key] && !activeKeys[key]) {
        activeKeys[key] = true;
        sendPress(keyMap[key]);
      }
    });
    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyMap[key]) {
        activeKeys[key] = false;
        sendRelease(keyMap[key]);
      }
    });

    // ========================
    // 📹 STREAM WEBCAM CON WEBRTC
    // ========================
    
    // Función para crear un video WebRTC nativo
    async function startWebRTCStream(url) {
      const pc = new RTCPeerConnection();
    
      // Crear video element
      const videoEl = document.createElement("video");
      videoEl.autoplay = true;
      videoEl.controls = true;
      videoEl.style.width = "90%";
      videoEl.style.maxWidth = "640px";
      videoEl.style.border = "3px solid #333";
      videoEl.style.borderRadius = "10px";
      videoContainer.appendChild(videoEl);
    
      // Reproducir la pista entrante
      pc.ontrack = (event) => {
        videoEl.srcObject = event.streams[0];
      };
    
      // Crear DataChannel (opcional)
      const dc = pc.createDataChannel("data");
    
      // Fetch SDP offer desde MediaMTX
      const response = await fetch(url + "/webrtc?token=" + token, {
        method: "POST",
        body: JSON.stringify({}),
      });
      const offer = await response.json();
    
      await pc.setRemoteDescription({ type: "offer", sdp: offer.sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
    
      // Enviar SDP answer al servidor
      await fetch(url + "/webrtc?token=" + token, {
        method: "POST",
        body: JSON.stringify(pc.localDescription),
        headers: { "Content-Type": "application/json" },
      });
    }
    
    // Reemplaza CAMERA_URL por la URL de tu Cloudflare Tunnel
    startWebRTCStream(CAMERA_URL);
  </script>
</body>
</html>
